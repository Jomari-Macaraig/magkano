# Local Postgres with pgvector. `pnpm db:up` starts it on port 5435.
name: magkano-local
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: magkano
      POSTGRES_PASSWORD: magkano
      POSTGRES_DB: magkano
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magkano -d magkano"]
      interval: 2s
      timeout: 5s
      retries: 15
volumes:
  pgdata:
